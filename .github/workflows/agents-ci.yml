name: Agents CI

on:
  push:
    paths:
      - "agents/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "vault/16-ai-studio-operations/**"
      - ".github/workflows/agents-ci.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "vault/16-ai-studio-operations/**"
      - ".github/workflows/agents-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Orchestrator, guard and vault-sync tests
        run: python -m unittest discover -s agents/tests -v
