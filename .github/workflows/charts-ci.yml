name: Charts CI

on:
  push:
    paths:
      - "charts/**"
      - ".github/workflows/charts-ci.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/charts-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chart tracker tests (offline)
        run: python -m unittest discover -s charts/tests -v
